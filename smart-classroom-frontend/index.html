
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="SMART CLASSROOM - Sistema inteligente de monitoreo ambiental de aulas">

    <title>SMART CLASSROOM | Inicio</title>

    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d0e14;
            color: #f1ede4;
            font-family: Arial, sans-serif;
        }

        .loading {
            text-align: center;
            padding: 30px;
        }

        .loading h1 {
            font-size: 24px;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .loading p {
            color: #a9a49a;
            font-size: 14px;
        }

        .spinner {
            width: 42px;
            height: 42px;
            border: 3px solid #33343d;
            border-top-color: #f0a53a;
            border-radius: 50%;
            margin: 0 auto 24px;
            animation: girar 0.8s linear infinite;
        }

        @keyframes girar {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <main class="loading">
        <div class="spinner" aria-hidden="true"></div>

        <h1>SMART CLASSROOM</h1>

        <p>Iniciando sistema de monitoreo ambiental...</p>
    </main>

    <script>
        (() => {
            "use strict";

            const token = sessionStorage.getItem("sc_token");

            if (token && token.trim() !== "") {
                // Usuario con token almacenado.
                window.location.replace(
                    "pages/dashboard.html"
                );
            } else {
                // Usuario sin sesión.
                window.location.replace(
                    "pages/login.html"
                );
            }
        })();
    </script>

</body>
</html>
