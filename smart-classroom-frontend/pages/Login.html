<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMART CLASSROOM · Iniciar sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/login.css">
</head>
<body>

<div class="scene">
  <div class="room-glow"></div>
  <canvas id="physics"></canvas>

  <main class="layout">

    <!-- Lámpara -->
    <section class="lamp-side" aria-label="Lámpara">
      <div class="lamp">
        <div class="cone"></div>

        <svg viewBox="0 0 260 480" aria-hidden="true">
          <defs>
            <radialGradient id="glow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#fff4c2" stop-opacity=".95"/>
              <stop offset="100%" stop-color="#f5c518" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <!-- Poste -->
          <rect x="128" y="120" width="4" height="320" rx="2" fill="#2a2a2f"/>
          <!-- Base -->
          <ellipse cx="130" cy="446" rx="34" ry="7" fill="#1b1b1f"/>
          <!-- Brillo de la bombilla -->
          <g class="bulb-glow">
            <ellipse cx="130" cy="118" rx="62" ry="16" fill="url(#glow)"/>
            <ellipse cx="130" cy="114" rx="40" ry="6" fill="#fff6cf"/>
          </g>
          <!-- Pantalla -->
          <path class="shade-fill" d="M62 116 C62 84 92 66 130 66 C168 66 198 84 198 116 Z"/>
          <path d="M62 116 L198 116" stroke="#0d0d10" stroke-width="2"/>
        </svg>

        <button class="pull" id="pull" type="button" aria-label="Encender o apagar la lámpara" aria-pressed="false">
          <span class="cord"></span>
          <span class="bead"></span>
        </button>

        <span class="hint">Jala la cadena para encender</span>
      </div>
    </section>

    <!-- Formulario -->
    <section class="form-side">
      <form class="card" id="loginForm" novalidate inert>
        <h1>Bienvenido</h1>
        <p class="sub">Ingresa tus datos para acceder al panel del aula</p>

        <div class="field">
          <input type="text" id="identifier" name="identifier" placeholder="Usuario o correo" autocomplete="username" required>
          <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        </div>

        <div class="field">
          <input type="password" id="password" name="password" placeholder="Contraseña" autocomplete="current-password" required>
          <svg class="ico" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          <button class="toggle-pass" id="togglePass" type="button" aria-label="Mostrar contraseña">
            <svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>

        <p class="error" id="error" role="alert" aria-live="polite"></p>

        <button class="btn" id="submitBtn" type="submit">
          <span class="spinner"></span>
          <span class="label">Iniciar sesión</span>
        </button>

        <p class="foot">SMART CLASSROOM · Monitoreo inteligente de aulas</p>
      </form>
    </section>

  </main>
</div>

<script src="../js/login.js"></script>
</body>
</html>
